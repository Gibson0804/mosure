
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: mosure_app
    container_name: mosure_app
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - ./.locked:/var/www/html/.locked
      - ./.env:/var/www/html/.env
      - ./database:/var/www/html/database
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mosure

  queue:
    image: mosure_app
    container_name: mosure_queue
    restart: unless-stopped
    env_file:
      - .env.docker
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      app:
        condition: service_started
    volumes:
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - ./database:/var/www/html/database
    networks:
      - mosure

# 定时任务,如果不需要可以注释掉该项
  cron:
    image: mosure_app
    container_name: mosure_cron
    restart: unless-stopped
    env_file:
      - .env.docker
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
    volumes:
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - ./database:/var/www/html/database
    networks:
      - mosure

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: mosure_web
    container_name: mosure_web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-9445}:80"
    networks:
      - mosure
    volumes:
      - storage:/var/www/html/storage

volumes:
  storage:
  bootstrap_cache:

networks:
  mosure:
    driver: bridge
